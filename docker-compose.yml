version: '3.8'

services:
  bot:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=bot/webhook_handler.py
    volumes:
      - ./bot:/app/bot
      - ./signals.log:/app/signals.log
      - ./trades.json:/app/trades.json
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
